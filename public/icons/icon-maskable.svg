<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="mBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>
    <linearGradient id="mRoseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Safe Zone in Maskable Icon -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Center Card (well within the inner 80% circle safe zone: radius ~204 around center 256,256) -->
  <rect x="86" y="106" width="340" height="300" rx="36" fill="url(#mBadgeGrad)" stroke="#ffe4e6" stroke-width="3" />

  <!-- Heart/Ribbon Emblem -->
  <g transform="translate(256, 185) scale(0.85)">
    <path d="M-42 -10 C-42 -38, -12 -44, 0 -24 C12 -44, 42 -38, 42 -10 C42 22, 10 44, 0 54 C-10 44, -42 22, -42 -10 Z" fill="url(#mRoseAccent)" />
    <path d="M-18 -8 C-18 -22, -6 -25, 0 -15 C6 -25, 18 -22, 18 -8 C18 8, 4 20, 0 25 C-4 20, -18 8, -18 -8 Z" fill="#ffffff" />
  </g>

  <!-- Wordmark "PRAFESTA" -->
  <text x="256" y="278"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="38"
        font-weight="900"
        letter-spacing="1"
        fill="#e11d48"
        text-anchor="middle">
    PRAFESTA
  </text>

  <!-- Pill DOCS -->
  <g transform="translate(161, 308)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#0f172a" />
    <text x="95" y="22"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
          font-size="13"
          font-weight="800"
          letter-spacing="2"
          fill="#f43f5e"
          text-anchor="middle">
      PORTAL DOCS
    </text>
  </g>

  <!-- Subtitle -->
  <text x="256" y="370"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="12"
        font-weight="700"
        letter-spacing="1"
        fill="#64748b"
        text-anchor="middle">
    ASSINATURA DE DOCUMENTOS
  </text>
</svg>
